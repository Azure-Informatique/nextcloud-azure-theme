version = 1
SPDX-PackageName = "azure_theme"

[[annotations]]
path = ["l10n/**.js", "l10n/**.json", "translationfiles/**.po", "translationfiles/**.pot"]
precedence = "aggregate"
SPDX-FileCopyrightText = ["2026 Nexeno contributors", "2026 Azure Informatique"]
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = ["img/**", "src/assets/images/**", "docs/images/**", "css/**", "js/page/**", "scss/_images.scss"]
precedence = "aggregate"
SPDX-FileCopyrightText = ["2026 Nexeno contributors", "2026 Azure Informatique"]
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = "LICENSE"
precedence = "aggregate"
SPDX-FileCopyrightText = "2007 Free Software Foundation, Inc."
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = ["package.json", "package-lock.json", "composer.json", "composer.lock", ".gitignore", ".nextcloudignore", "krankerl.toml"]
precedence = "aggregate"
SPDX-FileCopyrightText = "none"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["fonts/**"]
precedence = "override"
SPDX-FileCopyrightText = "2011, 2022, 2023 Canonical Ltd."
SPDX-License-Identifier = "LicenseRef-UFL-1.0"
